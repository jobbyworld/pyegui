[package]
name = "pyegui"
version = "0.7.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
members = ["core", "finder-rs"]

[workspace.dependencies]
craft-pdf = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "a9949872bd91ecf6bcec4e86339e3f50ad007fb9", default-features = false, features = ["read", "raster", "write"] }

[lib]
name = "pyegui"
crate-type = ["cdylib"]

[dependencies]
pyegui-core = { path = "core", default-features = false }
pyo3 = { version = "0.30.1", features = ["chrono", "abi3-py311", "generate-import-lib", "extension-module"] }
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
egui_extras = { version = "0.37.0", features = ["datepicker", "all_loaders", "serde"] }
image = { version = "0.25", features = ["jpeg", "png", "ico", "gif", "webp", "bmp"] }
chrono = "0.4.45"
serde_json = "1"
jiff = "0.2.42"
egui_ltreeview = "0.10.0"
egui_tiles = "0.18.0"
egui_plot = "0.38.0"
egui_commonmark = "0.26.0"
window-vibrancy = "0.8.1"
raw-window-handle = "0.6.2"
log = { version = "0.4.35", features = ["release_max_level_info"] }
pyo3-log = "0.13.5"
mermaid-svg = "0.7"
usvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
resvg = { version = "0.45", default-features = false }  # draws the SVG cursors (Windows)
alacritty_terminal = "0.26"
notify = "8.2"
# PDF: reader, interpreter and raster of craft-libs (the reader of findcraft). `kurbo` is the geometry of the
# `Device` trait of the interpreter, which reads the text of the pages.
craft-pdf = { workspace = true, optional = true }
kurbo = { version = "0.13", optional = true }
ttf-parser = { version = "0.25", optional = true }
pulldown-cmark = { version = "0.13", default-features = false }
harfrust = { version = "0.12", optional = true }  # the shaper of egui: the glyphs (ligatures, kerning) of the text written to a PDF

# the profile of the executable of finder-rs (CI: cargo build --profile dist -p finder-rs)
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[features]
default = ["pdf"]
pdf = ["pyegui-core/pdf", "dep:craft-pdf", "dep:kurbo", "dep:ttf-parser", "dep:harfrust"]

# craft-pdf README: consumers patch the hayro trees with the same rev.
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "a9949872bd91ecf6bcec4e86339e3f50ad007fb9" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "a9949872bd91ecf6bcec4e86339e3f50ad007fb9" }
hayro = { git = "https://github.com/storytold/craft-libs", rev = "a9949872bd91ecf6bcec4e86339e3f50ad007fb9" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "a9949872bd91ecf6bcec4e86339e3f50ad007fb9" }
# the writer of craft-pdf (`write`) draws with krilla, patched in the same repository
krilla = { git = "https://github.com/storytold/craft-libs", rev = "a9949872bd91ecf6bcec4e86339e3f50ad007fb9" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWorkspace", "NSAccessibility", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSWindow", "NSEvent", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData", "NSGeometry", "NSURL", "NSArray"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
