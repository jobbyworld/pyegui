# "Open with Finder" in the short context menu of Windows 11: an IExplorerCommand in a DLL, declared by a
# sparse MSIX package (see scripts/shellext_windows.py). Independent of pyegui: its own workspace and target dir.
[package]
name = "pyegui_shellext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

windows-core = "0.62"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
