# The part of pyegui that does not depend on Python: file watcher, PDF readers, text colors...
# Used by the Python extension (`pyegui`) and by the pure Rust Finder (`finder-rs`).
[package]
name = "pyegui-core"
version = "0.7.0"
edition = "2021"
description = "pyegui without Python: the logic shared by the Python extension and the Rust applications"

# the docstrings keep the Python examples of the API: they are not Rust doctests
[lib]
doctest = false

[dependencies]
egui = "0.37.0"
notify = "8.2"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
egui_ltreeview = "0.10.0"
egui_commonmark = "0.26.0"
mermaid-svg = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
usvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
alacritty_terminal = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4.45"
craft-pdf = { workspace = true, optional = true }
kurbo = { version = "0.13", optional = true }
ttf-parser = { version = "0.25", optional = true }
harfrust = { version = "0.12", optional = true }
window-vibrancy = "0.8.1"
raw-window-handle = "0.6.2"

[features]
default = ["pdf"]
pdf = ["dep:craft-pdf", "dep:kurbo", "dep:ttf-parser", "dep:harfrust"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSView", "NSWindow", "NSAccessibility", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData", "NSGeometry"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
