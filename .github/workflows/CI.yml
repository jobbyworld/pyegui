# Build wheels (Windows x64 and ARM64, macOS x86_64 and arm64). No publication to PyPI.
# A pushed tag v* also publishes the wheels as a GitHub Release.
name: CI

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish as a GitHub Release (empty: only build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python-arch: x64
            sccache: true
          # Windows on ARM (Snapdragon PCs): built natively on GitHub's ARM64 runner (public repos),
          # where setup-python installs an ARM64 Python for --find-interpreter
          - runner: windows-11-arm
            target: aarch64
            python-arch: arm64
            sccache: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          architecture: ${{ matrix.python-arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ matrix.sccache }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-15
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: true
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # The pure Rust Finder (finder-rs): one executable per platform, nothing to install.
  finder-windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile dist -p finder-rs
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/dist/finder.exe -DestinationPath dist/Finder-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: finder-windows-${{ matrix.arch }}
          path: dist

  finder-macos:
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile dist -p finder-rs --target ${{ matrix.target }}
      - name: App and dmg
        run: |
          python3 scripts/bundle_finder_macos.py --binary target/${{ matrix.target }}/dist/finder --out dist
          mv dist/Finder.dmg dist/Finder-macos-${{ matrix.arch }}.dmg
          rm -rf dist/Finder.app
      - uses: actions/upload-artifact@v4
        with:
          name: finder-macos-${{ matrix.arch }}
          path: dist

  finder-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile dist -p finder-rs
      - name: Pack
        run: |
          mkdir -p dist
          tar -czf dist/Finder-linux-x86_64.tar.gz -C target/dist finder
      - uses: actions/upload-artifact@v4
        with:
          name: finder-linux-x86_64
          path: dist

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [windows, macos, finder-windows, finder-macos, finder-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,finder-*}"
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v head="## ${TAG#v}" 'index($0, "## ") == 1 { p = (index($0, head) == 1); next } p' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl dist/Finder-* --clobber
          else
            gh release create "$TAG" dist/*.whl dist/Finder-* --verify-tag --title "pyegui ${TAG#v}" --notes-file notes.md
          fi
